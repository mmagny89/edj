; docker/php/conf.d/20-app.dev.ini — developpement uniquement.
;
; opcache.validate_timestamps = 1, pas de revalidate_freq : chaque requete
; revalide les fichiers modifies (conventions, section 13). Xdebug est
; installe dans le stage dev du Dockerfile mais son mode n'est jamais fixe
; ici ni dans une ENV du Dockerfile : il est pilote a l'execution par la
; variable d'environnement XDEBUG_MODE du conteneur (conventions, section
; 13), pour permettre un changement de mode par simple redemarrage.
opcache.validate_timestamps = 1

display_errors = On
error_reporting = E_ALL
