; docker/php/conf.d/20-app.staging.ini — staging uniquement.
;
; staging derive de prod dans docker/php/Dockerfile (FROM prod AS staging),
; qui charge 20-app.prod.ini (opcache.validate_timestamps = 0) avant ce
; fichier. Sans redefinir explicitement les deux directives ci-dessous,
; staging heriterait en silence de l'opcache fige de prod, ce qui n'est
; jamais correct : une recette staging obligerait alors a reconstruire
; l'image pour chaque changement (conventions, section 13).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Logs verbeux : staging journalise sans exposer les details dans le
; navigateur.
display_errors = Off
log_errors = On
error_reporting = E_ALL
