; docker/php/conf.d/20-app.prod.ini — production uniquement.
;
; opcache fige (conventions, section 13) : aucune revalidation des fichiers
; a chaque requete, ce qui suppose une image reconstruite a chaque
; deploiement.
opcache.validate_timestamps = 0
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
