# Override developpement. Autosuffisant avec compose.yml seul :
#   docker compose -f compose.yml -f compose.dev.yml up -d
# (ou "docker compose up -d" nu, via COMPOSE_FILE du .env racine).
services:
  edj-php:
    build:
      target: dev
    image: edj-php:dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE}
      # Le stage dev de l'image pose FRANKENPHP_WORKER_CONFIG=watch, sans
      # argument : FrankenPHP surveille alors /app en entier. Or Symfony
      # reecrit app/var/cache a chaque requete en developpement — le worker
      # redemarre, reconstruit le cache, ce qui declenche un nouveau
      # redemarrage, et le serveur finit par ne plus repondre du tout.
      # app/vendor et app/node_modules ajoutent au passage plus de cent
      # mille fichiers a surveiller pour rien.
      #
      # La surveillance est donc restreinte aux repertoires que l'on edite
      # reellement. Les assets du front ont leur propre rechargement, par
      # "npm run watch" : public/build est volontairement absent d'ici.
      FRANKENPHP_WORKER_CONFIG: |-
        watch /app/src
        watch /app/templates
        watch /app/config
        watch /app/translations
        watch /app/public/index.php
    volumes:
      - ./app:/app
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${HTTP3_PORT}:443/udp"

  edj-worker:
    image: edj-php:dev
    volumes:
      - ./app:/app

  edj-database:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  # Capture du courrier sortant en developpement uniquement : jamais dans
  # compose.yml, donc jamais present en staging ni en production.
  edj-mailpit:
    container_name: edj-mailpit
    image: axllent/mailpit:v${MAILPIT_VERSION}
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - edj
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"

  edj-ember:
    ports:
      - "${EMBER_PORT}:9191"
