# Override staging. Serveur partage : Traefik en frontal. Lancement toujours explicite :
#   docker compose -f compose.yml -f compose.staging.yml --env-file .env.staging.local up -d --wait
# --env-file REMPLACE le .env racine (conventions, section 3).
services:
  php:
    # Capabilities reduites au strict necessaire. NET_BIND_SERVICE est la seule
    # indispensable : frankenphp ecoute sur le port 80, et la capability posee sur
    # son binaire au build (setcap) ne sert a rien si le conteneur la perd. Un
    # cap_drop: ALL seul : « exec: frankenphp: Operation not permitted ».
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # L'image est construite sur le serveur, depuis le clone, par
    # outils/deployer.sh. Le stage et le tag sont figes ici plutot que laisses
    # a ${TARGET} : un fichier de secrets incomplet ne doit pas pouvoir
    # deployer l'image de developpement.
    build:
      target: staging
    image: edj-php:staging
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET est requis en staging (secret applicatif Symfony) — fournir via --env-file .env.staging.local}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM est requis en staging (adresse d'expedition) — fournir via --env-file .env.staging.local}
    # Serveur partage : pas de port public direct, Traefik route par
    # domaine sur le reseau partage "proxy" (a creer une fois sur
    # l'hote : docker network create proxy).
    expose:
      - "80"
    networks:
      - edj
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.edj-staging.rule: Host(`${APP_DOMAIN:?APP_DOMAIN est requis en staging (domaine public route par Traefik) — fournir via --env-file .env.staging.local}`)
      traefik.http.routers.edj-staging.entrypoints: websecure
      traefik.http.routers.edj-staging.tls.certresolver: letsencrypt
      traefik.http.services.edj-staging.loadbalancer.server.port: "80"

  worker:
    image: edj-php:staging
    networks:
      - edj

  database:
    # Le moteur demarre en root, cree son repertoire de donnees et bascule sur
    # son utilisateur : CHOWN, SETUID, SETGID, DAC_OVERRIDE et FOWNER suffisent.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

networks:
  edj:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
