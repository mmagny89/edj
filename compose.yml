# Socle commun a tous les environnements (conventions, section 1). Genere
# par .claude/scripts/setup-symfony.sh.
name: edj

services:
  edj-php:
    container_name: edj-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${TARGET}
      args:
        PHP_VERSION: ${PHP_VERSION}
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_EXTENSION_INSTALLER_VERSION: ${PHP_EXTENSION_INSTALLER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    image: edj-php:${TARGET}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@edj-database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      # Ce que Caddy sert dans le conteneur : "localhost" en developpement
      # (TLS interne), ":80" en staging et production (Traefik termine le
      # TLS en amont). Le domaine public, lui, n'apparait que dans le label
      # Traefik des overrides, via APP_DOMAIN.
      SERVER_NAME: ${SERVER_NAME}
      MAILER_DSN: ${MAILER_DSN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    volumes:
      - edj-caddy-data:/data
      - edj-caddy-config:/config
      - edj-caddy-admin:/run/caddy
    networks:
      - edj
    depends_on:
      edj-database:
        condition: service_healthy

  # Consommateur Messenger. Les courriels sont routes vers le transport
  # "async" (config/packages/messenger.yaml) : sans ce service, ils
  # s'accumulent en base et aucune notification de bulletin d'adhesion ne
  # part jamais. Ecart assume au manifeste, qui ne prevoit pas de worker.
  #
  # RUN_MIGRATIONS vaut 0 ici quel que soit l'environnement : la mise a jour
  # de schema appartient au conteneur web, deux conteneurs qui migrent en
  # parallele au demarrage se marchent dessus.
  edj-worker:
    container_name: edj-worker
    image: edj-php:${TARGET}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@edj-database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
      RUN_MIGRATIONS: 0
      MAILER_DSN: ${MAILER_DSN}
      SERVER_NAME: ${SERVER_NAME}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    # --time-limit fait sortir le worker toutes les heures ; restart le
    # relance. C'est la parade recommandee a la derive memoire d'un processus
    # PHP de longue duree.
    command: ["php", "/app/bin/console", "messenger:consume", "async", "--time-limit=3600"]
    # Le healthcheck de l'image sonde /health en HTTP : ce conteneur ne sert
    # aucune page, il serait donc signale "unhealthy" en permanence et ferait
    # echouer tout "up -d --wait". La sante du worker tient a son processus,
    # deja surveille par restart: unless-stopped.
    healthcheck:
      disable: true
    networks:
      - edj
    depends_on:
      edj-database:
        condition: service_healthy

  edj-database:
    container_name: edj-database
    image: postgres:${POSTGRES_VERSION}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ : monter le repertoire parent, pas .../data
      # (conventions, section 16 — verifier a chaque montee de version
      # majeure, ce chemin n'est pas garanti stable).
      - edj-database-data:/var/lib/postgresql
    networks:
      - edj
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sans profil ici (conventions, section 9) : les overrides staging/prod
  # lui en ajoutent un, jamais l'inverse.
  edj-ember:
    container_name: edj-ember
    image: ghcr.io/alexandre-daubois/ember:${EMBER_VERSION}
    restart: unless-stopped
    environment:
      EMBER_ADDR: unix//run/caddy/admin.sock
    volumes:
      - edj-caddy-admin:/run/caddy
    networks:
      - edj
    depends_on:
      - edj-php

networks:
  edj:
    name: edj

volumes:
  edj-caddy-data:
    name: edj-caddy-data
  edj-caddy-config:
    name: edj-caddy-config
  edj-caddy-admin:
    name: edj-caddy-admin
  edj-database-data:
    name: edj-database-data
