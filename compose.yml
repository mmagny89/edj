# Socle commun a tous les environnements (conventions, section 1). Genere
# par .claude/scripts/setup-symfony.sh.
name: edj-${ENV}

services:
  php:
    container_name: edj-${ENV:?ENV manquant — suffixe d'environnement des conteneurs, reseaux et volumes}-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${TARGET}
      args:
        PHP_VERSION: ${PHP_VERSION}
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_EXTENSION_INSTALLER_VERSION: ${PHP_EXTENSION_INSTALLER_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    image: edj-php:${TARGET}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      # Ce que Caddy sert dans le conteneur : "localhost" en developpement
      # (TLS interne), ":80" en staging et production (Traefik termine le
      # TLS en amont). Le domaine public, lui, n'apparait que dans le label
      # Traefik des overrides, via APP_DOMAIN.
      SERVER_NAME: ${SERVER_NAME}
      MAILER_DSN: ${MAILER_DSN}
      # Adresse d'expedition des courriels du site. Obligatoire en staging et en
      # production (compose.prod.yml), ou elle doit appartenir a un domaine que
      # l'association controle : un fournisseur d'envoi (Brevo) refuse ou remplace
      # l'expediteur d'un domaine qui n'est pas authentifie chez lui.
      MAILER_FROM: ${MAILER_FROM}
      # Lien d'invitation du groupe WhatsApp des adherents. FACULTATIF : sans lui,
      # l'e-mail de confirmation omet simplement ce lien. Declaree sans « :? »,
      # contrairement aux secrets obligatoires (conventions, section 5) : une
      # integration facultative ne doit pas pouvoir faire echouer un deploiement
      # — elle l'a fait, avant meme que les migrations ne tournent. Le repli
      # est vide, jamais une valeur a recopier. Jamais committe : c'est une
      # invitation, qui donne l'acces a quiconque la detient.
      MEMBERS_WHATSAPP_URL: ${MEMBERS_WHATSAPP_URL-}
      # Le site se declare-t-il indexable par les moteurs de recherche ? 0 tant
      # que le domaine definitif n'est pas en service (domaine provisoire :
      # robots.txt interdit tout et chaque page est en noindex), 1 ensuite.
      # Facultative, sans « :? » : un oubli laisse le site invisible — le sens
      # sur — et non un deploiement qui echoue. Repli a 0, jamais a 1.
      SITE_INDEXABLE: ${SITE_INDEXABLE-0}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES?SYMFONY_TRUSTED_PROXIES doit etre declaree (vide en developpement, private_ranges derriere un proxy)}
    volumes:
      - edj-caddy-data:/data
      - edj-caddy-config:/config
      - edj-caddy-admin:/run/caddy
    networks:
      - edj
    depends_on:
      database:
        condition: service_healthy

  # Consommateur Messenger. Les courriels sont routes vers le transport
  # "async" (config/packages/messenger.yaml) : sans ce service, ils
  # s'accumulent en base et aucune notification de bulletin d'adhesion ne
  # part jamais. Ecart assume au manifeste, qui ne prevoit pas de worker.
  #
  # RUN_MIGRATIONS vaut 0 ici quel que soit l'environnement : la mise a jour
  # de schema appartient au conteneur web, deux conteneurs qui migrent en
  # parallele au demarrage se marchent dessus.
  worker:
    container_name: edj-${ENV}-worker
    image: edj-php:${TARGET}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
      RUN_MIGRATIONS: 0
      MAILER_DSN: ${MAILER_DSN}
      # Les trois variables que les courriels lisent au rendu : expediteur,
      # lien WhatsApp et drapeau d'indexation. Elles sont injectees ici a
      # l'identique du conteneur web (conventions, section 3) : le worker est
      # le service qui rend et envoie reellement les messages, et sans elles
      # chaque envoi echoue sur « Environment variable not found », rejoue
      # trois fois puis tombe en echec — le conteneur reste « running » et
      # rien ne part. Defaut reel, constate le 2026-10-18.
      MAILER_FROM: ${MAILER_FROM}
      MEMBERS_WHATSAPP_URL: ${MEMBERS_WHATSAPP_URL-}
      SITE_INDEXABLE: ${SITE_INDEXABLE-0}
      SERVER_NAME: ${SERVER_NAME}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES?SYMFONY_TRUSTED_PROXIES doit etre declaree (vide en developpement, private_ranges derriere un proxy)}
    # --time-limit fait sortir le worker toutes les heures ; restart le
    # relance. C'est la parade recommandee a la derive memoire d'un processus
    # PHP de longue duree.
    # Deux transports : "async" pour les courriels, "scheduler_default" pour
    # les taches recurrentes declarees dans App\Schedule (purge nocturne des
    # evenements passes). Le planificateur ne tourne que tant qu'un
    # consommateur ecoute ce transport : l'oublier ne provoque aucune erreur,
    # la tache ne part simplement jamais.
    command: ["php", "/app/bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600"]
    # Le healthcheck de l'image sonde /health en HTTP : ce conteneur ne sert
    # aucune page, il serait donc signale "unhealthy" en permanence et ferait
    # echouer tout "up -d --wait". La sante du worker tient a son processus,
    # deja surveille par restart: unless-stopped.
    healthcheck:
      disable: true
    networks:
      - edj
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: edj-${ENV}-database
    image: postgres:${POSTGRES_VERSION}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ : monter le repertoire parent, pas .../data
      # (conventions, section 16 — verifier a chaque montee de version
      # majeure, ce chemin n'est pas garanti stable).
      - edj-database-data:/var/lib/postgresql
    networks:
      - edj
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edj:
    name: edj-${ENV}

volumes:
  edj-caddy-data:
    name: edj-${ENV}-caddy-data
  edj-caddy-config:
    name: edj-${ENV}-caddy-config
  edj-caddy-admin:
    name: edj-${ENV}-caddy-admin
  edj-database-data:
    name: edj-${ENV}-database-data
