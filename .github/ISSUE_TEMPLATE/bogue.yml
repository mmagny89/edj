name: Bogue
description: Quelque chose ne fonctionne pas comme attendu sur le site.
labels: [bogue]
body:
  - type: textarea
    id: constate
    attributes:
      label: Ce qui se passe
      description: Decrivez ce que vous voyez, avec une capture d'ecran si possible.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Aller sur la page « Evenements »
        2. Cliquer sur ...
        3. Le calendrier reste vide
    validations:
      required: true
  - type: input
    id: contexte
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 142 sur Android, ou Safari sur iPhone
  - type: markdown
    attributes:
      value: |
        **Faille de securite ?** N'ouvrez pas d'issue : suivez
        [SECURITY.md](../blob/main/SECURITY.md).
