# Portes qualite, puis deploiement (conventions, section 22). Un seul
# fichier : un workflow decrit le chemin de main vers la production.
#
# Une porte = un job, nomme par ce qu'il prouve (skill ci-pipeline-standards).
# Les portes s'enchainent par cout croissant ; celles qui ne se doivent rien
# tournent en parallele. Le nom du workflow est le texte du badge du README
# (badges-readme.md) : il ne se renomme pas.
name: Qualité et déploiement

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Redeploiement manuel, ou rollback en choisissant un autre commit.
  workflow_dispatch:

# Une execution par branche. L'annulation ne vaut que pour les demandes de
# fusion : sur main, elle couperait un deploiement en cours de migration.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Le code applicatif vit dans app/, la racine ne porte que l'infrastructure
# (conventions, section 1). Les jobs qui ne font aucun checkout, ou qui ne
# travaillent que sur les fichiers de la racine, remettent ".".
defaults:
  run:
    working-directory: app

# La CI n'utilise pas Docker Compose : rien n'injecte les variables que
# compose.yml fournit au conteneur. Sans elles, le post-install-cmd de Composer
# compile le conteneur et echoue sur « Environment variable not found », dans
# toutes les portes, y compris celles qui ne touchent jamais la base
# (conventions, sections 8b et 22).
env:
  # Suit PHP_VERSION du .env racine, source de verite unique (section 5) :
  # jamais plus recente que l'image de production. Toute montee de version
  # touche aussi le defaut de .github/actions/php/action.yml.
  PHP_VERSION: '8.4'
  APP_ENV: test
  APP_SECRET: ci-only-not-a-real-secret
  DATABASE_URL: postgresql://edj:edj@127.0.0.1:5432/edj?serverVersion=18&charset=utf8
  MAILER_DSN: null://null
  MAILER_FROM: test@example.test
  MEMBERS_WHATSAPP_URL: ''
  SITE_INDEXABLE: '0'
  SYMFONY_TRUSTED_PROXIES: ''

jobs:
  # --- Porte 1 — rien en amont : la moins chere, elle garde les autres.
  coherence:
    name: Cohérence du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      - name: Coherence de composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint PHP
        run: find src config public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Lints Symfony
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container
          php bin/console lint:twig templates

  # --- Porte 2 — ne depend de rien : une vulnerabilite connue est vraie que
  # le code soit propre ou non, et c'est la seule porte dont l'echec peut
  # exiger une action le jour meme. Bloquante : jamais de « || true ».
  securite:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      - name: Audit des dependances
        run: composer audit --locked

  # --- Porte 3
  style:
    name: Style de code
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      # Une porte ignoree doit se voir sans ouvrir le job : sinon elle le
      # reste pour toujours. D'ou le resume d'execution, lisible depuis la
      # pull request.
      - name: Style du code
        run: |
          if [ -x vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "⊘ **Style de code** — PHP CS Fixer absent. L'activer : \`composer require --dev friendsofphp/php-cs-fixer\`" >> "$GITHUB_STEP_SUMMARY"
            echo "PHP CS Fixer absent — porte ignoree."
          fi

  # --- Porte 4
  analyse:
    name: Analyse statique
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      - name: Analyse statique
        run: |
          if [ -x vendor/bin/phpstan ]; then
            # phpstan-symfony lit le conteneur compile en environnement dev,
            # chemin fige dans phpstan.neon. La CI tournant en APP_ENV=test,
            # var/cache/dev n'existe pas sans ce rechauffage et l'analyse
            # echoue sur « Container ... does not exist ».
            php bin/console cache:warmup --env=dev
            vendor/bin/phpstan analyse --no-progress --error-format=github
          else
            echo "⊘ **Analyse statique** — PHPStan absent. L'activer : \`composer require --dev phpstan/phpstan\`" >> "$GITHUB_STEP_SUMMARY"
            echo "PHPStan absent — porte ignoree."
          fi

  # --- Porte 5 — frontieres entre couches ou modules.
  frontieres:
    name: Frontières du code
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      - name: Frontieres du code
        run: |
          if [ -x vendor/bin/deptrac ] && [ -f deptrac.yaml ]; then
            vendor/bin/deptrac analyse --no-progress
          else
            echo "⊘ **Frontières du code** — Deptrac non configuré. L'activer : \`composer require --dev deptrac/deptrac\`, puis écrire \`deptrac.yaml\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Deptrac non configure — porte ignoree."
          fi

  # --- Porte 6 — la plus chere des portes PHP : elle attend que le code soit
  # propre et analyse avant d'allumer une base de donnees.
  tests:
    name: Tests unitaires et d'intégration
    needs: [style, analyse]
    runs-on: ubuntu-latest
    # Suit POSTGRES_VERSION du .env racine, comme PHP_VERSION ci-dessus.
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: edj
          POSTGRES_PASSWORD: edj
          POSTGRES_DB: edj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      # Le schema de test (suffixe _test de Doctrine) se construit par les
      # migrations, comme en production. Sans cette etape, tout test qui ecrit
      # echoue sur « relation ... does not exist ».
      - name: Base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      # Le repertoire tests/ ne contient pour l'instant que son bootstrap :
      # l'etape se saute d'elle-meme tant qu'aucun test n'est ecrit, plutot que
      # d'echouer sur « No tests executed » ou de faire croire a une couverture
      # qui n'existe pas. Le resume la rend visible depuis la pull request.
      - name: Tests
        run: |
          if [ -n "$(find tests -name '*Test.php' -print -quit)" ]; then
            vendor/bin/phpunit
          else
            echo "⊘ **Tests** — app/tests/ ne contient aucun \`*Test.php\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun test — porte ignoree."
          fi

  # --- Porte 7 — job distinct, et non une etape du precedent : une suite de
  # tests construit souvent son schema sans passer par les migrations. Rejouees
  # sur la meme base, celles-ci echoueraient sur « table ... already exists »,
  # un faux echec qui ne dit rien de l'etat reel des migrations. Un job separe
  # recoit une base neuve.
  migrations:
    name: Schéma et migrations
    needs: coherence
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: edj
          POSTGRES_PASSWORD: edj
          POSTGRES_DB: edj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/php

      - name: Schema en phase avec les entites
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

  # --- Porte 8 — build Webpack Encore.
  front:
    name: Front — build Webpack Encore
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les dependances Composer AVANT celles de npm, comme le fait le stage
      # prod_builder de l'image : package.json declare
      # "@symfony/ux-turbo": "file:vendor/symfony/ux-turbo/assets". Sans
      # vendor/, stimulus-bridge echoue a la compilation sur « The file
      # "@symfony/ux-turbo/package.json" could not be found », loin de sa
      # cause.
      - uses: ./.github/actions/php

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci et non npm install : la CI doit installer exactement ce que
      # decrit package-lock.json, comme le fait le stage prod_builder.
      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm run build
        run: npm run build

  # --- Porte 9 — la plus lente, donc la derniere.
  image:
    name: Image — build du stage prod
    needs: [coherence, front]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      # Versions lues dans le .env racine, source de verite unique
      # (conventions, section 5) : jamais recopiees dans ce fichier.
      - name: Lire les versions du .env racine
        run: grep -E '^(PHP_VERSION|FRANKENPHP_VERSION|PHP_EXTENSION_INSTALLER_VERSION|NODE_VERSION)=' .env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Build seul, jamais de push : l'image de production est construite sur
      # le serveur, par outils/deployer.sh. Ce job existe pour qu'un Dockerfile
      # casse se voie ici, et non au milieu d'un deploiement.
      - name: docker build (stage prod)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            PHP_EXTENSION_INSTALLER_VERSION=${{ env.PHP_EXTENSION_INSTALLER_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Agregateur : le seul controle requis par la protection de branche.
  # Ajouter ou renommer une porte ne casse plus la regle GitHub en silence.
  portes:
    name: Portes qualité
    needs: [coherence, securite, style, analyse, frontieres, tests, migrations, front, image]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      # Par env: et non en interpolation directe — un resultat interpole est
      # recopie dans le corps du script avant execution.
      - name: Verdict des portes
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultats : $RESULTATS"
          case "$RESULTATS" in
            *failure*|*cancelled*)
              echo "Au moins une porte qualite a cede." >&2
              exit 1
              ;;
          esac
          echo "Toutes les portes qualite sont vertes."

  # Le deploiement lui-meme vit sur le serveur : outils/deployer.sh, versionne
  # avec le projet, appele par une forced command SSH (conventions, section
  # 22). Ce job n'envoie donc aucune commande — l'argument "prod" est fixe par
  # authorized_keys, cote serveur. Les chemins et les secrets ne quittent
  # jamais la machine, et la cle confiee a GitHub ne peut rien lancer d'autre.
  deploiement:
    name: Deploiement en production
    needs: portes
    # Jamais sur une demande de fusion : une PR d'un depot tiers deploierait
    # du code non relu.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .
    # Deux deploiements simultanes visent le meme clone et le meme stack : on
    # attend son tour, on ne coupe jamais un deploiement en cours.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      # GitHub remplace un secret absent par une chaine vide, sans rien
      # signaler : ssh "@" produit alors une page d'usage illisible au lieu
      # d'une erreur. Defaut reel, paye au premier declenchement.
      - name: Controler la presence des secrets de deploiement
        env:
          DEPLOIEMENT_HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          DEPLOIEMENT_UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          manquants=''
          for v in DEPLOIEMENT_HOTE DEPLOIEMENT_UTILISATEUR DEPLOIEMENT_CLE_PRIVEE DEPLOIEMENT_KNOWN_HOSTS; do
            eval "valeur=\${$v}"
            [ -n "$valeur" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Secrets manquants::A definir dans Settings → Secrets and variables → Actions :$manquants"
            exit 1
          fi

      - name: Preparer l'acces SSH au serveur
        env:
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOIEMENT_CLE_PRIVEE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # L'empreinte du serveur est fournie en secret et verifiee : jamais
          # de StrictHostKeyChecking=no, qui accepterait n'importe quel hote
          # se presentant a cette adresse. known_hosts est indexe par
          # l'adresse exacte de connexion — une IP et un domaine y sont deux
          # entrees distinctes.
          printf '%s\n' "$DEPLOIEMENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Aucune commande n'est passee : la forced command d'authorized_keys
      # impose "outils/deployer.sh prod" et ignore ce que le client demande.
      # Le script tire la branche main, construit l'image, joue les
      # migrations, fait le menage et verifie la reponse du site depuis
      # l'exterieur — sa sortie est relayee ici.
      - name: Lancer le deploiement sur le serveur
        env:
          DEPLOIEMENT_HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          DEPLOIEMENT_UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOIEMENT_UTILISATEUR@$DEPLOIEMENT_HOTE"
