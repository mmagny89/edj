# Portes qualite, puis deploiement (conventions, section 22). Un seul
# fichier : un workflow decrit le chemin de main vers la production.
#
# Ordre fail-fast : ce qui echoue vite passe en premier, les etapes Docker
# (les plus lentes) en dernier.
name: qualite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Redeploiement manuel, ou rollback en choisissant un autre commit.
  workflow_dispatch:

# Une execution par branche. L'annulation ne vaut que pour les demandes de
# fusion : sur main, elle couperait un deploiement en cours de migration.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Le code applicatif vit dans app/, la racine ne porte que l'infrastructure
# (conventions, section 1). Le job de deploiement remet "." : il ne travaille
# que sur les fichiers Compose de la racine.
defaults:
  run:
    working-directory: app

jobs:
  php:
    name: PHP — lint, audit, tests
    runs-on: ubuntu-latest
    # La CI n'utilise pas Docker Compose : rien n'injecte les variables que
    # compose.yml fournit au conteneur. Sans elles, le post-install-cmd de
    # Composer compile le conteneur et echoue sur « Environment variable not
    # found », dans tous les jobs (conventions, sections 8b et 22).
    env:
      APP_ENV: test
      APP_SECRET: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://edj:edj@127.0.0.1:5432/edj_test?serverVersion=18&charset=utf8
      MAILER_DSN: null://null
      SYMFONY_TRUSTED_PROXIES: ''
    steps:
      - uses: actions/checkout@v5

      # Version PHP : celle du .env racine, source de verite unique
      # (conventions, section 5). GitHub Actions ne sait pas le lire, d'ou
      # cette duplication assumee — jamais une version plus recente que celle
      # de l'image de production.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: composer validate
        run: composer validate --no-check-publish

      - uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Vulnerabilites connues des dependances installees. Bloquant : une
      # faille connue ne doit pas atteindre main.
      - name: Audit de securite des dependances
        run: composer audit --locked

      - name: Lint PHP
        run: find src config public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint des conteneurs et de la configuration Symfony
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container

      - name: Lint des templates Twig
        run: php bin/console lint:twig templates

      # Le repertoire tests/ ne contient pour l'instant que son bootstrap :
      # l'etape se saute d'elle-meme tant qu'aucun test n'est ecrit, plutot
      # que d'echouer sur "No tests executed" ou de faire croire a une
      # couverture qui n'existe pas.
      - name: PHPUnit
        run: |
          if [ -n "$(find tests -name '*Test.php' -print -quit)" ]; then
            vendor/bin/phpunit
          else
            echo "::warning title=Aucun test::app/tests/ ne contient aucun *Test.php — etape sautee."
          fi

  front:
    name: Front — build Webpack Encore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci et non npm install : la CI doit installer exactement ce que
      # decrit package-lock.json, comme le fait le stage prod_builder.
      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm run build
        run: npm run build

  image:
    name: Image — build du stage prod
    needs: [php, front]
    # Sur main, c'est le job de deploiement qui construit l'image (et la
    # pousse) : la rebatir ici serait payer deux fois le meme build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      # Versions lues dans le .env racine, source de verite unique
      # (conventions, section 5) : jamais recopiees dans ce fichier.
      - name: Lire les versions du .env racine
        run: grep -E '^(PHP_VERSION|FRANKENPHP_VERSION|PHP_EXTENSION_INSTALLER_VERSION|NODE_VERSION)=' .env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Build seul, sans push : verifie que l'image de production se
      # construit avant qu'un merge sur main ne declenche un deploiement.
      - name: docker build (stage prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            PHP_EXTENSION_INSTALLER_VERSION=${{ env.PHP_EXTENSION_INSTALLER_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chaine : build de l'image sur le runner -> push sur GHCR -> le serveur
  # tire l'image et redemarre. Le serveur ne construit jamais rien : son CPU
  # reste disponible pour servir le site, et l'image deployee est exactement
  # celle qui a ete testee.
  #
  # Ecart assume aux conventions (section 22), qui prevoient un script
  # outils/deployer.sh appele par forced command SSH : ici Docker Compose est
  # pilote a distance via DOCKER_HOST=ssh://, les fichiers compose viennent du
  # checkout du runner et les secrets des GitHub Secrets — il n'y a donc ni
  # clone ni fichier de secrets a maintenir sur le serveur. outils/deployer.sh
  # reste fourni pour un deploiement manuel depuis un clone.
  deploiement:
    name: Deploiement en production
    needs: [php, front]
    # Jamais sur une demande de fusion : une PR d'un depot tiers deploierait
    # du code non relu.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .
    # Deux deploiements simultanes visent le meme stack : on attend son tour,
    # on ne coupe jamais un deploiement en cours.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GitHub remplace un secret absent par une chaine vide, sans rien
      # signaler : ssh "@" produit alors une page d'usage illisible au lieu
      # d'une erreur. Defaut reel, paye au premier declenchement.
      - name: Controler la presence des secrets de deploiement
        env:
          DEPLOIEMENT_HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          DEPLOIEMENT_UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
        run: |
          manquants=''
          for v in DEPLOIEMENT_HOTE DEPLOIEMENT_UTILISATEUR DEPLOIEMENT_CLE_PRIVEE \
                   DEPLOIEMENT_KNOWN_HOSTS APP_SECRET POSTGRES_PASSWORD APP_DOMAIN PROXY_NETWORK; do
            eval "valeur=\${$v}"
            [ -n "$valeur" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Secrets manquants::A definir dans Settings → Secrets and variables → Actions :$manquants"
            exit 1
          fi

      # Les versions d'images sont lues dans le .env racine, source de verite
      # unique (conventions, section 5) : jamais recopiees ici, sans quoi une
      # montee de version dans le .env laisserait la CI sur l'ancienne.
      - name: Lire les versions du .env racine
        run: grep -E '^(PHP_VERSION|FRANKENPHP_VERSION|PHP_EXTENSION_INSTALLER_VERSION|NODE_VERSION|POSTGRES_VERSION|EMBER_VERSION|MAILPIT_VERSION)=' .env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deux tags : le SHA du commit (immuable, c'est lui qui est deploye et
      # qui permet un rollback exact) et "prod" (commodite de lecture, il
      # bouge a chaque deploiement).
      - name: Build et push de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/edj-php:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/edj-php:prod
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            PHP_EXTENSION_INSTALLER_VERSION=${{ env.PHP_EXTENSION_INSTALLER_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparer l'acces SSH au serveur
        env:
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOIEMENT_CLE_PRIVEE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # L'empreinte du serveur est fournie en secret et verifiee : jamais
          # de StrictHostKeyChecking=no, qui accepterait n'importe quel hote
          # se presentant a cette adresse.
          printf '%s\n' "$DEPLOIEMENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'IdentityFile ~/.ssh/id_deploy\nIdentitiesOnly yes\n' > ~/.ssh/config

      # --env-file REMPLACE le .env racine (conventions, section 3) : ce
      # fichier porte donc TOUTES les cles, pas seulement les secrets, sans
      # quoi DATABASE_URL serait assemblee sur les valeurs de developpement.
      # Il est ecrit sur le runner, jamais sur le serveur, et disparait avec lui.
      - name: Composer .env.prod.local a partir des secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Aucun transport reel pour l'instant : null://null n'envoie rien.
          # Definir le secret MAILER_DSN le jour ou un SMTP existe.
          MAILER_DSN: ${{ secrets.MAILER_DSN || 'null://null' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
        run: |
          cat > .env.prod.local <<ENVFILE
          ENV=prod
          PHP_VERSION=${PHP_VERSION}
          FRANKENPHP_VERSION=${FRANKENPHP_VERSION}
          PHP_EXTENSION_INSTALLER_VERSION=${PHP_EXTENSION_INSTALLER_VERSION}
          NODE_VERSION=${NODE_VERSION}
          POSTGRES_VERSION=${POSTGRES_VERSION}
          EMBER_VERSION=${EMBER_VERSION}
          MAILPIT_VERSION=${MAILPIT_VERSION}
          MAILPIT_UI_PORT=8025
          TARGET=prod
          USER_ID=1000
          GROUP_ID=1000
          EMBER_PORT=9191
          PROXY_NETWORK=${PROXY_NETWORK}
          RUN_MIGRATIONS=0
          POSTGRES_DB=edj
          POSTGRES_USER=edj
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          APP_SECRET=${APP_SECRET}
          APP_DOMAIN=${APP_DOMAIN}
          SERVER_NAME=:80
          MAILER_DSN=${MAILER_DSN}
          SYMFONY_TRUSTED_PROXIES=private_ranges
          PHP_IMAGE=ghcr.io/${{ github.repository_owner }}/edj-php:${{ github.sha }}
          ENVFILE

      - name: Deploiement
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOIEMENT_UTILISATEUR }}@${{ secrets.DEPLOIEMENT_HOTE }}
          COMPOSE: docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod.local
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
        run: |
          set -euo pipefail

          # Le reseau partage avec Traefik doit exister avant tout "up" : il
          # est declare "external" cote compose, donc jamais cree par lui.
          docker network inspect "$PROXY_NETWORK" >/dev/null 2>&1 \
            || { echo "::error title=Reseau absent::Le reseau Docker '$PROXY_NETWORK' n'existe pas sur le serveur. Le creer une fois : docker network create $PROXY_NETWORK"; exit 1; }

          $COMPOSE pull

          # La base doit tourner avant la migration, et la migration avant que
          # le nouveau code ne serve : RUN_MIGRATIONS vaut 0 en production
          # (conventions, section 8), la migration est donc explicite ici.
          $COMPOSE up -d --wait database
          $COMPOSE run --rm --no-deps php php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

          # --wait bloque jusqu'a l'etat healthy : l'etape echoue si le
          # conteneur ne repond pas, au lieu de rendre la main sur un
          # deploiement casse.
          $COMPOSE up -d --wait --remove-orphans

          $COMPOSE ps

      # Derriere un proxy, un conteneur peut se declarer healthy et le site
      # rester inaccessible (conventions, section 22b) : la seule verification
      # qui compte se fait depuis l'exterieur.
      - name: Verifier la reponse du site depuis l'exterieur
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$APP_DOMAIN/")"
          echo "HTTP $code sur https://$APP_DOMAIN/"
          case "$code" in 2*|3*) ;; *) echo "::error title=Site injoignable::https://$APP_DOMAIN/ repond $code"; exit 1 ;; esac

      # Les images des deploiements precedents s'accumulent sinon jusqu'a
      # saturer le disque du serveur, qui heberge d'autres projets.
      - name: Purge des images obsoletes sur le serveur
        if: always()
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOIEMENT_UTILISATEUR }}@${{ secrets.DEPLOIEMENT_HOTE }}
        run: docker image prune -af --filter 'until=168h'
