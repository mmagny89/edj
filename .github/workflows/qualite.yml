# Portes qualite, puis deploiement (conventions, section 22). Un seul
# fichier : un workflow decrit le chemin de main vers la production.
#
# Ordre fail-fast : ce qui echoue vite passe en premier, les etapes Docker
# (les plus lentes) en dernier.
name: qualite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Redeploiement manuel, ou rollback en choisissant un autre commit.
  workflow_dispatch:

# Une execution par branche. L'annulation ne vaut que pour les demandes de
# fusion : sur main, elle couperait un deploiement en cours de migration.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Le code applicatif vit dans app/, la racine ne porte que l'infrastructure
# (conventions, section 1). Le job de deploiement remet "." : il ne travaille
# que sur les fichiers Compose de la racine.
defaults:
  run:
    working-directory: app

jobs:
  php:
    name: PHP — lint, audit, tests
    runs-on: ubuntu-latest
    # La CI n'utilise pas Docker Compose : rien n'injecte les variables que
    # compose.yml fournit au conteneur. Sans elles, le post-install-cmd de
    # Composer compile le conteneur et echoue sur « Environment variable not
    # found », dans tous les jobs (conventions, sections 8b et 22).
    env:
      APP_ENV: test
      APP_SECRET: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://edj:edj@127.0.0.1:5432/edj_test?serverVersion=18&charset=utf8
      MAILER_DSN: null://null
      SYMFONY_TRUSTED_PROXIES: ''
    steps:
      - uses: actions/checkout@v5

      # Version PHP : celle du .env racine, source de verite unique
      # (conventions, section 5). GitHub Actions ne sait pas le lire, d'ou
      # cette duplication assumee — jamais une version plus recente que celle
      # de l'image de production.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: composer validate
        run: composer validate --no-check-publish

      - uses: ramsey/composer-install@v3
        with:
          working-directory: app

      # Vulnerabilites connues des dependances installees. Bloquant : une
      # faille connue ne doit pas atteindre main.
      - name: Audit de securite des dependances
        run: composer audit --locked

      - name: Lint PHP
        run: find src config public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint des conteneurs et de la configuration Symfony
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container

      - name: Lint des templates Twig
        run: php bin/console lint:twig templates

      # Le repertoire tests/ ne contient pour l'instant que son bootstrap :
      # l'etape se saute d'elle-meme tant qu'aucun test n'est ecrit, plutot
      # que d'echouer sur "No tests executed" ou de faire croire a une
      # couverture qui n'existe pas.
      - name: PHPUnit
        run: |
          if [ -n "$(find tests -name '*Test.php' -print -quit)" ]; then
            vendor/bin/phpunit
          else
            echo "::warning title=Aucun test::app/tests/ ne contient aucun *Test.php — etape sautee."
          fi

  front:
    name: Front — build Webpack Encore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les dependances Composer AVANT celles de npm, comme le fait le stage
      # prod_builder de l'image. package.json declare
      # "@symfony/ux-turbo": "file:vendor/symfony/ux-turbo/assets" : sans
      # vendor/, stimulus-bridge echoue a la compilation sur « The file
      # "@symfony/ux-turbo/package.json" could not be found », loin de sa
      # cause.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: composer install
        run: composer install --no-dev --no-interaction --no-progress --no-scripts

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci et non npm install : la CI doit installer exactement ce que
      # decrit package-lock.json, comme le fait le stage prod_builder.
      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm run build
        run: npm run build

  image:
    name: Image — build du stage prod
    needs: [php, front]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      # Versions lues dans le .env racine, source de verite unique
      # (conventions, section 5) : jamais recopiees dans ce fichier.
      - name: Lire les versions du .env racine
        run: grep -E '^(PHP_VERSION|FRANKENPHP_VERSION|PHP_EXTENSION_INSTALLER_VERSION|NODE_VERSION)=' .env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Build seul, jamais de push : l'image de production est construite sur
      # le serveur, par outils/deployer.sh. Ce job existe pour qu'un
      # Dockerfile casse se voie ici, et non au milieu d'un deploiement.
      - name: docker build (stage prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            PHP_EXTENSION_INSTALLER_VERSION=${{ env.PHP_EXTENSION_INSTALLER_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Le deploiement lui-meme vit sur le serveur : outils/deployer.sh, versionne
  # avec le projet, appele par une forced command SSH (conventions, section
  # 22). Ce job n'envoie donc aucune commande — l'argument "prod" est fixe par
  # authorized_keys, cote serveur. Les chemins et les secrets ne quittent
  # jamais la machine, et la cle confiee a GitHub ne peut rien lancer d'autre.
  deploiement:
    name: Deploiement en production
    needs: [php, front, image]
    # Jamais sur une demande de fusion : une PR d'un depot tiers deploierait
    # du code non relu.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .
    # Deux deploiements simultanes visent le meme clone et le meme stack : on
    # attend son tour, on ne coupe jamais un deploiement en cours.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      # GitHub remplace un secret absent par une chaine vide, sans rien
      # signaler : ssh "@" produit alors une page d'usage illisible au lieu
      # d'une erreur. Defaut reel, paye au premier declenchement.
      - name: Controler la presence des secrets de deploiement
        env:
          DEPLOIEMENT_HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          DEPLOIEMENT_UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          manquants=''
          for v in DEPLOIEMENT_HOTE DEPLOIEMENT_UTILISATEUR DEPLOIEMENT_CLE_PRIVEE DEPLOIEMENT_KNOWN_HOSTS; do
            eval "valeur=\${$v}"
            [ -n "$valeur" ] || manquants="$manquants $v"
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Secrets manquants::A definir dans Settings → Secrets and variables → Actions :$manquants"
            exit 1
          fi

      - name: Preparer l'acces SSH au serveur
        env:
          DEPLOIEMENT_CLE_PRIVEE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          DEPLOIEMENT_KNOWN_HOSTS: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOIEMENT_CLE_PRIVEE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # L'empreinte du serveur est fournie en secret et verifiee : jamais
          # de StrictHostKeyChecking=no, qui accepterait n'importe quel hote
          # se presentant a cette adresse. known_hosts est indexe par
          # l'adresse exacte de connexion — une IP et un domaine y sont deux
          # entrees distinctes.
          printf '%s\n' "$DEPLOIEMENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Aucune commande n'est passee : la forced command d'authorized_keys
      # impose "outils/deployer.sh prod" et ignore ce que le client demande.
      # Le script tire la branche main, construit l'image, joue les
      # migrations, fait le menage et verifie la reponse du site depuis
      # l'exterieur — sa sortie est relayee ici.
      - name: Lancer le deploiement sur le serveur
        env:
          DEPLOIEMENT_HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          DEPLOIEMENT_UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOIEMENT_UTILISATEUR@$DEPLOIEMENT_HOTE"
