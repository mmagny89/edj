parameters:
    # Adresse de contact de l'association : destinataire des notifications de
    # bulletin d'adhesion, et expediteur technique de ces messages.
    app.contact_email: 'enviedejouer89300@gmail.com'

    # Adresse d'expedition des courriels du site, distincte de l'adresse de
    # contact : l'association recoit et repond sur sa boite habituelle, mais le
    # courriel part d'un domaine authentifie chez le fournisseur d'envoi.
    app.mailer_from: '%env(MAILER_FROM)%'

    # Reseaux sociaux publics : une seule source pour le site et les e-mails.
    app.social.facebook: 'https://www.facebook.com/EnviedeJouer89/'
    app.social.instagram: 'https://www.instagram.com/envie_de_jouer_89/'

    # Le site est-il indexable ? Vient de l'environnement (compose.yml) : 0 sous un
    # domaine provisoire ou en recette, 1 le jour de la mise en ligne definitive.
    app.seo.indexable: '%env(bool:SITE_INDEXABLE)%'

    # Groupe Facebook des adherents : sa page est publique, l'acces y est
    # soumis a l'approbation d'un administrateur du groupe. Le parametre de suivi
    # « ?ref=share » du lien partage est retire.
    app.social.facebook_group: 'https://www.facebook.com/groups/enviedejouer89/'

    # Groupe WhatsApp des adherents. Vient de l'environnement (compose.yml) et
    # non du depot : un lien d'invitation WhatsApp donne acces a quiconque le
    # possede, sans approbation.
    app.social.members_whatsapp: '%env(MEMBERS_WHATSAPP_URL)%'

    # Communes de la communaute de communes du Jovinien, pour la repartition
    # geographique du tableau de bord. Joigny en fait partie mais est comptee a
    # part : c'est la commune ou l'association a son siege et ou elle joue.
    #
    # ATTENTION, liste incomplete : le registre officiel BANATIC annonce 19
    # communes et n'en publiait que 17 au relevé du 2026-10-18. Les deux
    # manquantes sont a ajouter ici — les adherents qui en viennent sont pour
    # l'instant comptes « hors territoire ».
    # Source : https://www.banatic.interieur.gouv.fr/intercommunalite/248900938-cc-du-jovinien
    app.territory.joigny: 'Joigny'
    app.territory.intercommunality:
        - 'Béon'
        - 'Brion'
        - 'Bussy-en-Othe'
        - 'Cézy'
        - 'Champlay'
        - 'Chamvres'
        - 'Cudot'
        - 'La Celle-Saint-Cyr'
        - 'Looze'
        - 'Paroy-sur-Tholon'
        - 'Précy-sur-Vrin'
        - 'Saint-Aubin-sur-Yonne'
        - 'Saint-Julien-du-Sault'
        - "Saint-Martin-d'Ordon"
        - 'Sépeaux-Saint-Romain'
        - 'Verlin'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'
