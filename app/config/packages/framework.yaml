# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

# Derriere Traefik, qui termine le TLS et transmet l'origine reelle dans les
# en-tetes X-Forwarded-*. Sans cette declaration, Symfony ignore ces en-tetes
# et genere des URL absolues en http:// avec l'IP du conteneur — liens de
# courriel casses, redirections vers la mauvaise origine.
#
# Les proxies de confiance eux-memes viennent de SYMFONY_TRUSTED_PROXIES, que
# Symfony lit d'office (trusted_proxies vaut
# %env(default::SYMFONY_TRUSTED_PROXIES)% par defaut) : rien a declarer ici.
# Elle est vide en developpement, ou aucun proxy ne se trouve devant le
# conteneur.
when@staging:
    framework:
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

when@prod:
    framework:
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
