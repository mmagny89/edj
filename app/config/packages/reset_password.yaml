symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Le lien n'est valable qu'une demi-heure : un mot de passe d'administration
    # ne doit pas pouvoir etre reinitialise par un courriel retrouve des jours
    # plus tard dans une boite partagee ou transferee.
    lifetime: 1800
    # Delai avant qu'un meme compte puisse redemander un lien. Il borne le
    # nombre de courriels que recoit une personne, que la demande vienne d'elle
    # ou de quelqu'un qui connait son adresse. Dix minutes laissent a qui n'a
    # rien recu le temps de verifier ses courriers indesirables, sans permettre
    # d'inonder une boite.
    throttle_limit: 600
    # Un lien utilise est supprime : voir ResetPasswordController.
    enable_garbage_collection: true
