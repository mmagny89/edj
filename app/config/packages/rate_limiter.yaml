# Limitation de debit du bulletin d'adhesion. Le formulaire est public et
# declenche un envoi de courriel a chaque depot valide : sans plafond, il
# devient un relais a spam.
#
# Le plafond porte sur l'adresse IP, et une famille entiere partage la meme :
# une adhesion = un bulletin, donc un foyer de cinq personnes depose cinq
# bulletins d'affilee depuis la meme connexion. Une salle de jeux, un partage
# de connexion ou un reseau associatif peuvent en cumuler davantage encore.
# Le plafond est donc dimensionne pour ne jamais gener un usage legitime, pas
# pour etre au plus juste : il n'existe que contre l'envoi automatise.
framework:
    rate_limiter:
        membership_application:
            policy: 'sliding_window'
            limit: 40
            interval: '1 hour'
        # Courriel de confirmation, par destinataire. Le plafond par IP
        # ci-dessus borne un expediteur ; celui-ci borne la personne que l'on
        # pourrait inonder depuis des IP differentes en saisissant son adresse
        # dans le bulletin.
        #
        # Une meme adresse sert legitimement a plusieurs bulletins : une
        # adhesion = un bulletin, et un foyer partage souvent une seule boite —
        # les parents saisissent la leur pour chacun de leurs enfants. Le
        # plafond est donc dimensionne sur un grand foyer, pas au plus juste :
        # a trois par jour, le quatrieme bulletin d'une famille ne recevait
        # aucune confirmation, en silence.
        membership_confirmation_email:
            policy: 'sliding_window'
            limit: 12
            interval: '1 day'
        # Demande d'acces a l'espace adherent. Le formulaire envoie un courriel
        # a chaque numero connu : sans plafond, il permet d'ecrire en rafale a
        # tous les adherents, un numero apres l'autre. Dix demandes par heure et
        # par adresse IP laissent largement la place a qui cherche son numero.
        member_access_request:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # Second plafond, par destinataire : celui ci-dessus borne un
        # expediteur, celui-ci borne la personne que l'on pourrait inonder
        # depuis des adresses IP differentes. Distinct du plafond des
        # confirmations d'adhesion, qui est journalier : redemander son lien
        # quatre fois dans la journee est le fait d'une personne qui a perdu le
        # premier, pas d'un abus.
        #
        # Meme raison qu'au-dessus pour la valeur : une boite familiale recoit
        # le lien de chacun de ses adherents, et personne ne doit rester a la
        # porte parce que son frere a demande le sien avant lui.
        member_access_email:
            policy: 'sliding_window'
            limit: 12
            interval: '1 hour'

# Les tests rechargent le formulaire des centaines de fois depuis la meme adresse
# (127.0.0.1), et les compteurs survivent entre deux lancements : sans ce relevement
# le plafond horaire est atteint apres quelques suites, et les pages du bulletin
# repondent 429 au lieu d'echouer pour une vraie raison.
when@test:
    framework:
        rate_limiter:
            membership_application:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 hour'
            member_access_request:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 hour'
            member_access_email:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 hour'
            membership_confirmation_email:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 day'
