twig:
    cache: false # Désactive le cache des templates
    # Les instants sont enregistres en UTC et se lisent a l'heure de Paris.
    date:
        timezone: Europe/Paris
    debug: true
    auto_reload: true # Recharge automatiquement les templates
    globals:
        social_facebook: '%app.social.facebook%'
        social_instagram: '%app.social.instagram%'
        site_indexable: '%app.seo.indexable%'
        matomo_url: '%app.matomo.url%'
        matomo_site_id: '%app.matomo.site_id%'
        social_facebook_group: '%app.social.facebook_group%'
when@dev:
    twig:
        cache: false
        debug: true
        auto_reload: true
